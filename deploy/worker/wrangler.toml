# Deploys the public edge front for Syntra AI to syntra-ai.<your-account>.workers.dev.
# The Worker itself only proxies /api/* to the engine (see src/index.js) and
# serves the built interface from ./public (filled in by CI from frontend/dist
# before `wrangler deploy` runs — see .github/workflows/deploy-worker.yml).
name = "syntra-ai"
main = "src/index.js"
compatibility_date = "2026-11-25"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
