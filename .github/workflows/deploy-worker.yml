# Deploys the edge front (deploy/worker/) to Cloudflare Workers at
# syntra-ai.<account>.workers.dev: builds the interface, drops it into the
# Worker's assets folder, and runs `wrangler deploy`. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (a token with Workers Scripts:Edit) and
# CLOUDFLARE_ACCOUNT_ID (Workers & Pages overview page, right-hand sidebar).
# The Worker itself proxies /api/* to the engine at BACKEND_ORIGIN in
# deploy/worker/src/index.js — that engine is deployed separately (Render).
name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ALKAMELGIS/Syntra-AI' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Build the interface
        if: steps.creds.outputs.ok == 'true'
        working-directory: frontend
        run: npm ci && npx vite build
      - name: Fill the Worker's asset folder
        if: steps.creds.outputs.ok == 'true'
        run: |
          rm -rf deploy/worker/public
          mkdir -p deploy/worker/public
          cp -r frontend/dist/. deploy/worker/public/
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/worker
          command: deploy
