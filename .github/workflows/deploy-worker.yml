# Deploys the syntra-ai Worker (the reverse-proxy front at
# syntra-ai.alkamelgis.workers.dev, see deploy/worker/) straight through the
# Cloudflare API with wrangler, bypassing Cloudflare's own Git-connected
# "Workers Builds" pipeline entirely (its internal build token kept failing
# independently of anything in this repo). The assets it ships are the ones
# build-worker-assets.yml already builds and commits to deploy/worker/public/.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - a token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - the account ID shown on the Workers & Pages overview page
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "deploy/worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/worker
          command: deploy
